  repo-url: https://github.com/fianaise/fianaise.ie
  navbar:
    left:
      - text: Religion in Ireland
        menu:
          - href: religion/index.qmd
            text: Overview
          - href: religion/primary-school-survey.qmd
            text: Primary School Survey 2026
          - href: religion/charities.qmd
