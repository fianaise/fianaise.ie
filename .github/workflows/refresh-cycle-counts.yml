# Keep the cycling pages up to date with DLR's open bicycle counter data.
#
# Every Monday (or by hand from the Actions tab) this downloads DLR's counts
# from Smart Dublin. If any file is new or changed, it redraws the cycling
# charts, commits the data and figures to the branch it ran on, and, on main,
# republishes the site. (A push made by this workflow doesn't start the
# "Publish site" workflow, so it publishes itself.)
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  push:
    paths:
      - "tools/fetch_cycle_counts.py"
      - "analysis/cycling/*.py"
      - ".github/workflows/refresh-cycle-counts.yml"

name: Refresh cycle counts

permissions:
  contents: write

concurrency:
  group: refresh-cycle-counts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas plotly==7.1.0
      - name: Fetch counts
        id: fetch
        run: |
          python3 tools/fetch_cycle_counts.py
          if [ -n "$(git status --porcelain analysis/cycling/data/raw)" ] || [ "${{ github.event_name }}" != "schedule" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Redraw charts
        if: steps.fetch.outputs.changed == 'true'
        run: |
          python3 analysis/cycling/make_counter_page.py
          python3 analysis/cycling/make_cycling_charts.py
          python3 -I tools/slim_plotly.py figures/cycling_*.html
      - name: Commit
        id: commit
        if: steps.fetch.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/cycling/data figures/cycling_*.html cycling/_dlr-counter-stats.md cycling/_dlr-counter-patterns.md
          if git diff --cached --quiet; then
            echo "Nothing changed"
          else
            git commit -m "Update DLR cycle counter data and charts"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: quarto-dev/quarto-actions/setup@v2
        if: steps.commit.outputs.pushed == 'true' && github.ref == 'refs/heads/main'
      - uses: quarto-dev/quarto-actions/publish@v2
        if: steps.commit.outputs.pushed == 'true' && github.ref == 'refs/heads/main'
        with:
          target: gh-pages
