# Redraw the school maps when a new "Data on Individual Schools" list arrives,
# and open a pull request with the new figures.
#
# gov.ie refuses automated requests from GitHub's servers, so the list comes in
# one of two ways:
#   - upload it to analysis/charts/data/raw/ on GitHub (Add file > Upload files);
#     the push to main starts this workflow.
#   - run this workflow by hand from the Actions tab; it tries gov.ie and the
#     data.gov.ie portal, and does nothing if neither has a newer list.
on:
  push:
    branches: main
    paths:
      - "analysis/charts/data/raw/**"
  workflow_dispatch:

name: Refresh school data

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    # Merging this workflow's own pull request pushes the list again; skip that.
    if: ${{ !startsWith(github.event.head_commit.message, 'Redraw school maps') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 pandas openpyxl numpy folium==0.20.0 plotly==7.1.0
      - name: Fetch school lists
        id: fetch
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          python3 tools/fetch_school_lists.py
          if [ -n "$(git status --porcelain analysis/charts/data/raw)" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      # Plotly gives each figure a fresh id, so only redraw when the data changed.
      - name: Redraw maps
        if: steps.fetch.outputs.changed == 'true'
        run: |
          python3 analysis/charts/make_maps.py
          python3 -I tools/slim_plotly.py figures/ethos_current_config.html figures/map2_current_vs_preference.html figures/patronage_maps.html figures/preference_vs_provision.html
      - uses: peter-evans/create-pull-request@v7
        if: steps.fetch.outputs.changed == 'true'
        with:
          branch: data/school-lists
          delete-branch: true
          title: "Redraw school maps from the latest school list"
          commit-message: "Redraw school maps from the latest school list"
          body: |
            A new or changed "Data on Individual Schools" list arrived, and the maps were
            redrawn from it. Check the school counts and the ethos map before merging.
          add-paths: |
            analysis/charts/data/raw/*.xlsx
            figures/*.html
            religion/_patronage-stats.md
